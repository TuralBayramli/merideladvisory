# The "Ask our AI" chat on merideladvisory.com: a Cloudflare Worker that answers
# with Workers AI. Deployed by .github/workflows/deploy.yml when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
name = "meridel-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
# Any Workers AI text model. Gemma is strong in many languages, Azerbaijani included.
MODEL = "@cf/google/gemma-4-26b-a4b-it"

# At most 8 questions a minute from one visitor (per Cloudflare location).
[[ratelimits]]
name = "LIMITER"
namespace_id = "2611"

  [ratelimits.simple]
  limit = 8
  period = 60
