name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'social/**'
      - '.github/workflows/voiceover.yml'
      - '.github/workflows/fetch-music.yml'
      - '.github/workflows/fetch-photos.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set in Settings > Secrets and variables > Actions. Without them the
      # site is published without the AI chat.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci

      - name: Deploy the AI chat (Cloudflare Worker)
        id: chat
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true
        working-directory: chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.168.0 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "Chat address: ${url:-not found}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          PUBLIC_CHAT_URL: ${{ steps.chat.outputs.url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
