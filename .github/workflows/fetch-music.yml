name: Fetch music

# Run by hand from the Actions tab. Downloads background music tracks from
# Pixabay into social/music/ (see social/music/CREDITS.md).

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: Comma-separated name|url pairs (Pixabay download links)
        required: true

permissions:
  contents: write

concurrency:
  group: voiceover
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download
        env:
          TRACKS: ${{ inputs.tracks }}
        run: python3 social/music/fetch.py

      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/music
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Music: add tracks"
          git pull --rebase origin main
          git push
