name: Make voiceover

# Run by hand from the Actions tab. Reads the scripts in social/voice/,
# turns each paragraph into speech with Azure AI Speech and saves the MP3s
# in social/audio/. Needs the AZURE_SPEECH_KEY and AZURE_SPEECH_REGION secrets.

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: Scripts in social/voice (names without .txt, comma separated)
        default: xidmet-xerci,tanitim
        required: true
      voices:
        description: Azure voices (comma separated)
        default: az-AZ-BabekNeural
        required: true
      rate:
        description: Speaking rate, for example 0% or +8%
        default: '+6%'
        required: true
      pitch:
        description: Voice pitch, for example 0% or +8%
        default: '+6%'
        required: true
      label:
        description: Optional name for this version (keeps it apart from others)
        default: ''
        required: false
      list_voices:
        description: Only list the voices that can speak Azerbaijani (no speech is made)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: voiceover
  cancel-in-progress: false

jobs:
  speak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: List voices that speak Azerbaijani
        if: ${{ inputs.list_voices }}
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 social/voice/voices.py

      - name: Turn scripts into speech
        if: ${{ !inputs.list_voices }}
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SCRIPTS: ${{ inputs.scripts }}
          VOICES: ${{ inputs.voices }}
          RATE: ${{ inputs.rate }}
          PITCH: ${{ inputs.pitch }}
          LABEL: ${{ inputs.label }}
        run: python3 social/voice/tts.py

      - name: Save to the repository
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/audio social/voice/azerbaijani-voices.md 2>/dev/null || git add social/audio
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Voiceover: $SCRIPTS"
          git pull --rebase origin main
          git push
